<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Insid · UI Prototype</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap">
    <style>
      :root {
        --cyan: #22d3ee;
        --cyan-dim: #7de8f7;
        --bg: #05080f;
        --bg2: #091422;
        --panel: rgba(8, 18, 30, 0.82);
        --text: #eafdff;
        --sub: #8fb6cf;
        --amber: #fbbf24;
        --green: #34e07a;
        --red: #ff6b6b;
        --line: rgba(63, 208, 255, 0.28);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; background: var(--bg); color: var(--text);
        font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
        letter-spacing: 0.02em;
      }
      body {
        display: flex; flex-direction: column;
        background:
          radial-gradient(900px 600px at 30% 0%, #0d2036 0%, transparent 60%),
          var(--bg);
      }

      /* ---- top bar ---- */
      header {
        display: flex; align-items: center; gap: 16px;
        padding: 10px 18px; border-bottom: 1px solid var(--line);
        background: rgba(4, 10, 20, 0.6);
      }
      .brand { font-weight: 700; letter-spacing: 0.18em; color: var(--cyan); }
      .modes { display: flex; gap: 6px; }
      .modes button {
        font: inherit; letter-spacing: 0.1em; color: var(--sub);
        background: rgba(10, 24, 40, 0.7); border: 1px solid var(--line);
        border-radius: 3px; padding: 5px 14px; cursor: pointer;
      }
      .modes button.active { background: var(--cyan); border-color: var(--cyan); color: #02141a; font-weight: 700; }
      .src { margin-left: auto; color: var(--sub); font-size: 11px; }
      .src b { color: var(--cyan-dim); font-weight: 600; }

      /* ---- layout ---- */
      main { flex: 1; display: flex; gap: 20px; padding: 18px; overflow: hidden; }
      .stage {
        flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 10px;
      }
      .stage-label { font-size: 10px; letter-spacing: 0.18em; color: var(--sub); }

      /* ---- phone ---- */
      /* the phone frame is the actual app surface people use — the drawn
         treatment, sleeker controls and motion all live here. The debug rail
         stays a plain technical tool panel on purpose, so it never reads as
         real app UI. */
      .phone {
        width: 390px; height: 800px; border-radius: 40px 44px 38px 46px/44px 38px 46px 40px;
        border: 2px solid rgba(120, 220, 255, 0.35);
        background: linear-gradient(#0a1726, #04080f);
        box-shadow: 0 0 0 10px #0a0f16, 0 24px 60px rgba(0,0,0,0.7), 0 0 50px rgba(34,211,238,0.10);
        position: relative; overflow: hidden; display: flex; flex-direction: column;
        font-family: 'Kalam', ui-monospace, monospace;
      }
      .notch {
        position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
        width: 120px; height: 22px; border-radius: 12px; background: #05080f; z-index: 5;
      }
      .statusbar {
        height: 40px; flex: 0 0 auto; display: flex; align-items: flex-end;
        justify-content: space-between; padding: 0 20px 4px; font-size: 10px; color: var(--sub);
        font-family: ui-monospace, monospace;
      }
      #screen { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 6px 18px 18px; overflow: hidden; position: relative; }

      /* every screen swap replaces #screen's children wholesale (innerHTML=),
         so a plain CSS entrance animation on freshly-inserted nodes replays on
         every transition with no JS hook at all — this is the "make it feel
         dynamic" pass. */
      #screen > * { animation: rise-in 0.3s cubic-bezier(.2,.7,.3,1) both; }
      #screen > *:nth-child(1) { animation-delay: 0s; }
      #screen > *:nth-child(2) { animation-delay: .02s; }
      #screen > *:nth-child(3) { animation-delay: .04s; }
      #screen > *:nth-child(4) { animation-delay: .06s; }
      #screen > *:nth-child(5) { animation-delay: .08s; }
      #screen > *:nth-child(n+6) { animation-delay: .1s; }
      @keyframes rise-in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #screen > * { animation: none; } }

      /* toast — lives outside #screen so a re-render never wipes it mid-flight.
         Standalone helper (see toast() in prototype.js); nothing else calls it. */
      .toast {
        position: absolute; left: 50%; bottom: 14px; transform: translate(-50%, 6px);
        background: rgba(10, 26, 20, 0.92); color: var(--green);
        border: 1.5px solid rgba(52,224,122,0.55); border-radius: 14px 10px 16px 8px/10px 16px 8px 14px;
        padding: 8px 16px; font: 700 12.5px 'Kalam', monospace;
        opacity: 0; pointer-events: none; z-index: 30;
        transition: opacity 0.2s ease, transform 0.2s ease;
        box-shadow: 0 6px 18px rgba(0,0,0,0.45);
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      /* ---- generic phone UI ---- */
      h2.title { font-size: 21px; margin: 4px 0 2px; letter-spacing: 0.01em; font-weight: 700; }
      .sub { color: var(--sub); font-size: 12px; margin-bottom: 12px; opacity: 0.85; }
      .pill {
        display: inline-block; font-size: 9.5px; letter-spacing: 0.16em; font-weight: 700;
        padding: 4px 11px; border-radius: 99px 90px 99px 90px/90px 99px 90px 99px;
        border: 1.5px solid rgba(34,211,238,0.45);
        background: rgba(34,211,238,0.08); color: var(--cyan-dim);
        font-family: ui-monospace, monospace;
      }
      .pill.amber { border-color: rgba(251,191,36,0.5); background: rgba(251,191,36,0.09); color: var(--amber); }
      .pill.green { border-color: rgba(52,224,122,0.5); background: rgba(52,224,122,0.09); color: var(--green); }

      /* buttons: sleeker (less padding, lighter weight, ink-outline primary
         instead of a solid slab) with a faint hand-drawn wobble on hover. */
      button.big {
        font: 700 14.5px 'Kalam', monospace; letter-spacing: 0.02em;
        width: 100%; padding: 11px; border-radius: 16px 12px 18px 10px/12px 18px 10px 16px;
        cursor: pointer; color: var(--bg); background-color: var(--cyan);
        border: 1.5px solid rgba(2,20,26,0.25); margin-top: 8px;
        transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
        box-shadow: 0 2px 0 rgba(2,20,26,0.18);
      }
      button.big:hover:not(:disabled) { transform: rotate(-0.4deg) translateY(-1px); filter: brightness(1.06); }
      button.big:active:not(:disabled) { transform: translateY(1px) scale(0.99); box-shadow: none; }
      button.big:disabled { background: rgba(120,160,180,0.18); color: rgba(220,240,255,0.32); cursor: not-allowed; box-shadow: none; }
      button.ghost {
        font: 500 13px 'Kalam', monospace; width: 100%; padding: 9px;
        border-radius: 13px 10px 15px 9px/10px 15px 9px 13px; cursor: pointer;
        background: rgba(255,255,255,0.04); color: var(--text); border: 1.5px dashed var(--line);
        margin-top: 8px; transition: border-color 0.15s, background 0.15s, transform 0.12s;
      }
      button.ghost:hover { border-color: var(--cyan-dim); background: rgba(255,255,255,0.07); transform: rotate(0.3deg); }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      .spacer { flex: 1; }

      .card {
        display: block; width: 100%; text-align: left; font: 500 13px 'Kalam', monospace; cursor: pointer;
        background: rgba(12, 28, 45, 0.7); border: 1.5px solid var(--line);
        border-radius: 12px 9px 13px 8px/9px 13px 8px 12px; padding: 10px 13px; margin-bottom: 7px; color: var(--text);
        transition: border-color 0.15s, background 0.15s, transform 0.12s;
      }
      .card:hover { border-color: var(--cyan); background: rgba(20, 48, 72, 0.75); transform: translateX(2px); }
      .card.sel { border-color: var(--cyan); background: rgba(34,211,238,0.14); }
      .card .nm { font-weight: 700; font-size: 13.5px; }
      .card .meta { color: var(--sub); font-size: 11px; margin-top: 2px; font-family: ui-monospace, monospace; opacity: 0.85; }
      .card .dist { float: right; color: var(--cyan-dim); font-size: 11.5px; font-weight: 700; }

      .stats { display: flex; gap: 6px; margin: 8px 0; }
      .stat {
        flex: 1; background: rgba(8, 20, 34, 0.75); border: 1.5px solid var(--line);
        border-radius: 10px 7px 11px 6px/7px 11px 6px 10px; padding: 7px 4px; text-align: center;
      }
      .stat b { display: block; font-size: 16px; color: var(--cyan-dim); font-family: 'Kalam', monospace; }
      .stat span { font-size: 9px; letter-spacing: 0.12em; color: var(--sub); opacity: 0.8; }

      canvas.map { width: 100%; border-radius: 12px 9px 13px 8px; border: 1.5px solid var(--line); background: #020610; display: block; }

      /* ---- map with floating controls (collector · recording) ---- */
      /* the map keeps the full height it's given; the buttons float ON it via
         an absolutely-positioned overlay instead of stacking in flow and
         squeezing the canvas down to whatever's left. */
      .map-wrap { position: relative; }
      .map-overlay {
        position: absolute; left: 8px; right: 8px; bottom: 8px;
        display: flex; flex-direction: column; gap: 6px;
      }
      .chip {
        font: 600 11.5px 'Kalam', monospace; padding: 7px 8px; text-align: center;
        border-radius: 999px 90px 999px 90px/90px 999px 90px 999px; cursor: pointer;
        background: rgba(6,16,28,0.72); backdrop-filter: blur(3px);
        border: 1.5px solid var(--line); color: var(--text);
        transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
      }
      .chip:hover { border-color: var(--cyan-dim); background: rgba(6,16,28,0.85); }
      .chip:active { transform: scale(0.94); }
      .chip-wide { width: 100%; border-color: rgba(251,191,36,0.55); color: var(--amber); font-weight: 700; }

      /* ---- GPS signal gate ---- */
      .sig-wrap {
        display: flex; flex-direction: column; align-items: center;
        padding: 16px 0 10px;
      }
      .sig-dot {
        width: 50px; height: 50px; border-radius: 48% 52% 50% 50%/50% 50% 52% 48%; margin-bottom: 10px;
        transition: background 0.4s, box-shadow 0.4s;
      }
      .sig-dot.poor { background: #ff6b6b; box-shadow: 0 0 26px rgba(255,107,107,0.55); }
      .sig-dot.fair { background: var(--amber); box-shadow: 0 0 26px rgba(251,191,36,0.55); }
      .sig-dot.good {
        background: var(--green); box-shadow: 0 0 32px rgba(52,224,122,0.7);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
      .sig-label { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; font-family: 'Kalam', monospace; }
      .sig-label.poor { color: #ff6b6b; }
      .sig-label.fair { color: var(--amber); }
      .sig-label.good { color: var(--green); }
      .sig-acc { font-size: 21px; font-weight: 700; color: var(--cyan-dim); margin-top: 4px; }

      /* ---- floor stepper ---- */
      .floor-row {
        display: flex; align-items: center; justify-content: space-between;
        gap: 10px; margin-top: 10px; padding: 9px 12px;
        border: 1.5px dashed var(--line); border-radius: 13px 9px 14px 8px/9px 14px 8px 13px;
        background: rgba(8, 20, 34, 0.65);
      }
      .stepper { display: flex; align-items: center; gap: 10px; }
      .stepper button {
        font: 700 16px 'Kalam', monospace; line-height: 1; width: 30px; height: 30px;
        border-radius: 50%; cursor: pointer; color: var(--cyan-dim);
        background: rgba(34,211,238,0.1); border: 1.5px solid var(--line);
        transition: background 0.15s, transform 0.12s;
      }
      .stepper button:hover { background: rgba(34,211,238,0.22); transform: scale(1.08); }
      .stepper b { font-size: 18px; min-width: 24px; text-align: center; color: var(--text); }

      /* ---- misc blocks ---- */
      .summary {
        border: 1.5px solid var(--line); border-radius: 13px 9px 14px 8px/9px 14px 8px 13px; padding: 10px 12px;
        background: rgba(8, 20, 34, 0.55);
      }
      .summary .kv { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
      .summary .kv span { color: var(--sub); opacity: 0.85; }
      .summary .kv b { color: var(--cyan-dim); font-weight: 600; }

      /* explainer copy — kept, but deliberately quiet: small, low-contrast,
         clipped to one line until hovered/focused, so the "why" never
         competes with the actual control on screen. */
      .note {
        font-size: 10.5px; color: var(--sub); line-height: 1.4; opacity: 0.55;
        border-left: 2px dashed var(--cyan); padding-left: 8px;
        max-height: 2.6em; overflow: hidden;
        -webkit-mask-image: linear-gradient(to bottom, #000 65%, transparent 100%);
        mask-image: linear-gradient(to bottom, #000 65%, transparent 100%);
        transition: opacity 0.15s ease, max-height 0.15s ease;
      }
      .note:hover, .note:focus-within {
        opacity: 0.95; max-height: 8em;
        -webkit-mask-image: none; mask-image: none;
      }

      .crossing {
        display: flex; justify-content: space-between; font-size: 11.5px;
        color: var(--amber); padding: 5px 9px; margin-top: 4px;
        border: 1.5px dashed rgba(251,191,36,0.4); border-radius: 10px 7px 11px 6px/7px 11px 6px 10px;
      }
      .crossing span { color: var(--sub); }
      .levelhead {
        font: 700 10px ui-monospace, monospace; letter-spacing: 0.16em;
        color: var(--cyan); margin: 10px 0 5px; padding-bottom: 3px;
        border-bottom: 1px solid var(--line);
      }
      .pill.warnpill { border-color: rgba(251,191,36,0.5); background: rgba(251,191,36,0.09); color: var(--amber); }

      /* ---- soft-gate sheet ---- */
      .sheet {
        border: 1.5px solid var(--line); border-top: 2px solid var(--amber);
        border-radius: 20px 14px 22px 12px/14px 22px 12px 20px; padding: 16px 16px 14px;
        background: linear-gradient(rgba(20,30,18,0.5), rgba(8,18,30,0.92));
        box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
      }
      .cost {
        margin-top: 12px; padding: 10px 12px; border-radius: 12px 8px 13px 7px/8px 13px 7px 12px;
        background: rgba(2,8,16,0.7); border: 1.5px solid rgba(251,191,36,0.28);
      }
      .cost .kv { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
      .cost .kv span { color: var(--sub); }
      .cost .kv b { color: var(--cyan-dim); font-weight: 700; }

      /* ---- compass ---- */
      .compass-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 6px 0; }
      canvas.compass { touch-action: none; cursor: grab; }
      canvas.compass:active { cursor: grabbing; }
      .heading-read { font-size: 28px; font-weight: 700; color: var(--cyan-dim); letter-spacing: 0.02em; font-family: 'Kalam', monospace; }
      .heading-hint { font-size: 11px; color: var(--sub); text-align: center; min-height: 32px; opacity: 0.85; }
      .heading-hint.ok { color: var(--green); opacity: 1; }

      /* ---- debug rail ---- */
      .rail {
        flex: 1; min-width: 300px; max-width: 460px; overflow-y: auto;
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px;
      }
      .rail h3 {
        font-size: 10.5px; letter-spacing: 0.2em; color: var(--cyan); margin: 18px 0 8px;
        border-bottom: 1px solid var(--line); padding-bottom: 5px;
      }
      .rail h3:first-child { margin-top: 0; }
      .rail label { display: block; font-size: 11px; color: var(--sub); margin: 9px 0 3px; }
      .rail input[type=range] { width: 100%; accent-color: var(--cyan); }
      .rail input[type=number], .rail input[type=text], .rail select {
        width: 100%; font: inherit; font-size: 12px; padding: 6px 8px; border-radius: 6px;
        background: #061020; color: var(--text); border: 1px solid var(--line);
      }
      .rail button {
        font: inherit; font-size: 11.5px; cursor: pointer; padding: 8px 10px; border-radius: 7px;
        background: rgba(34,211,238,0.1); color: var(--cyan-dim);
        border: 1px solid var(--line); width: 100%; margin-top: 6px; text-align: left;
      }
      .rail button:hover { background: rgba(34,211,238,0.2); }
      .rail button.on { background: var(--cyan); color: #02141a; font-weight: 700; }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .grid2 button { margin-top: 0; }
      .kv { display: flex; justify-content: space-between; font-size: 11px; padding: 3px 0; }
      .kv span { color: var(--sub); }
      .kv b { color: var(--cyan-dim); font-weight: 600; }
      .warn { color: var(--amber); font-size: 11px; line-height: 1.45; margin-top: 6px; }
      .log {
        margin-top: 8px; max-height: 130px; overflow-y: auto; font-size: 10.5px;
        color: var(--sub); border-top: 1px solid var(--line); padding-top: 6px;
      }
      .log div { padding: 1px 0; }
      .dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 6px; }
      .dpad button { margin: 0; text-align: center; }
      .dpad .blank { visibility: hidden; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">INSID · UI PROTOTYPE</div>
      <div class="modes">
        <button data-mode="collector" class="active">COLLECTOR</button>
        <button data-mode="user">USER</button>
      </div>
      <div class="src" id="src">loading…</div>
    </header>
    <main>
      <div class="stage">
        <div class="stage-label" id="stage-label">COLLECTOR · START</div>
        <div class="phone">
          <div class="notch"></div>
          <div class="statusbar">
            <div id="sb-left">9:41</div>
            <div id="sb-right">▮▮▮ 100%</div>
          </div>
          <div id="screen"></div>
          <div id="toast" class="toast"></div>
        </div>
      </div>
      <div class="rail" id="rail"></div>
    </main>
    <script type="module" src="./prototype.js"></script>
  </body>
</html>

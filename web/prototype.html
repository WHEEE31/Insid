<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Insid · UI Prototype</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
    <style>
      /* =====================================================================
         Design tokens — one source of truth, shared with the Insid site.
         Palette is lifted straight from the marketing page (ink/paper/cyan/
         amber) so the app and the site read as one product. Everything below
         composes from these; no screen invents its own colour, radius or size.
         ===================================================================== */
      :root {
        /* surfaces, darkest to lightest */
        --ink: #070b10;         /* page behind everything */
        --panel: #0e1720;       /* phone screen, debug rail */
        --surface: #131e29;     /* raised: cards, inputs */
        --surface-hi: #1a2734;  /* hover */

        /* text, three steps only */
        --paper: #e9f1f4;
        --fog: rgba(233, 241, 244, 0.62);
        --fog-dim: rgba(233, 241, 244, 0.40);

        /* hairlines */
        --line: rgba(233, 241, 244, 0.10);
        --line-strong: rgba(233, 241, 244, 0.18);

        /* accents — exactly two, plus one destructive.
           cyan = go / good / primary.  amber = attention / vertical.
           rose = stop, and nothing else. */
        --cyan: #2fe2cc;
        --cyan-soft: rgba(47, 226, 204, 0.12);
        --cyan-line: rgba(47, 226, 204, 0.35);
        --amber: #f5a93b;
        --amber-soft: rgba(245, 169, 59, 0.12);
        --amber-line: rgba(245, 169, 59, 0.32);
        --rose: #f2635a;
        --rose-soft: rgba(242, 99, 90, 0.12);
        --rose-line: rgba(242, 99, 90, 0.38);

        /* three typefaces, three jobs — display for headings and numerals,
           sans for anything a person reads as a sentence, mono for machine
           facts (units, refs, coordinates, state). Never mix the jobs. */
        --font-display: 'Rajdhani', system-ui, 'Segoe UI', sans-serif;
        --font-ui: 'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif;
        --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;

        --r-xs: 6px; --r-sm: 8px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px;
        --r-full: 999px;

        --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--ink); color: var(--paper);
        font: 400 14px/1.5 var(--font-ui);
        -webkit-font-smoothing: antialiased;
        display: flex; flex-direction: column;
      }
      button { font-family: inherit; }
      :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

      /* ---------- shared type utilities ---------- */
      .t-display { font: 700 26px/1.15 var(--font-display); letter-spacing: 0.01em; margin: 0; }
      .t-title   { font: 600 16px/1.3 var(--font-ui); margin: 0; }
      .t-body    { font: 400 13.5px/1.55 var(--font-ui); color: var(--fog); margin: 0; }
      .t-mono    { font: 400 12px/1.5 var(--font-mono); color: var(--fog); }
      .label {
        font: 500 10px var(--font-mono); letter-spacing: 0.16em;
        text-transform: uppercase; color: var(--fog-dim);
        margin: var(--s4) 0 var(--s2);
      }

      /* =====================================================================
         desktop chrome — deliberately minimal so the phone is the only thing
         asking for attention
         ===================================================================== */
      .topbar {
        display: flex; align-items: center; gap: var(--s5);
        padding: 0 var(--s5); height: 56px;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        font: 700 17px var(--font-display); letter-spacing: 0.14em; color: var(--paper);
      }
      .brand span {
        font: 400 10px var(--font-mono); letter-spacing: 0.16em;
        text-transform: uppercase; color: var(--fog-dim);
        margin-left: var(--s2);
      }

      /* segmented control — the one place two modes compete, so it's the one
         place a filled state is justified */
      .seg {
        display: flex; gap: 2px; padding: 3px;
        background: var(--panel); border: 1px solid var(--line);
        border-radius: var(--r-md);
      }
      .seg button {
        font: 500 12.5px var(--font-ui); color: var(--fog);
        background: none; border: 0; border-radius: var(--r-sm);
        padding: 5px 14px; cursor: pointer;
        transition: color 0.15s, background 0.15s;
      }
      .seg button:hover { color: var(--paper); }
      .seg button.on { background: var(--surface-hi); color: var(--paper); }

      .src { margin-left: auto; font: 400 11.5px var(--font-mono); color: var(--fog-dim); white-space: nowrap; }
      .src b { color: var(--fog); font-weight: 500; }
      /* the rail is the first thing worth dropping on a narrow window — the
         phone is the point of this page */
      @media (max-width: 980px) { .src { display: none; } }
      @media (max-width: 820px) { .rail { display: none; } main { justify-content: center; } }

      main {
        flex: 1; display: flex; gap: var(--s6);
        padding: var(--s5); overflow: hidden;
      }
      .stage { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: var(--s3); }
      .stage-label {
        font: 500 10px var(--font-mono); letter-spacing: 0.16em;
        text-transform: uppercase; color: var(--fog-dim);
      }

      /* =====================================================================
         phone
         ===================================================================== */
      .phone {
        width: 380px; height: 796px;
        border-radius: 46px;
        padding: 3px;
        background: linear-gradient(160deg, #26333f, #0d141b 55%, #1b2530);
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
        position: relative;
      }
      .screen-shell {
        height: 100%; border-radius: 43px; overflow: hidden;
        background: var(--panel);
        display: flex; flex-direction: column; position: relative;
      }
      .island {
        position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
        width: 104px; height: 26px; border-radius: var(--r-full);
        background: #05080c; z-index: 6;
      }
      .statusbar {
        flex: 0 0 auto; height: 48px;
        display: flex; align-items: flex-end; justify-content: space-between;
        padding: 0 22px 5px;
        font: 500 11px var(--font-mono); color: var(--fog-dim);
      }
      #screen {
        flex: 1; min-height: 0; display: flex; flex-direction: column;
        padding: 0 20px 22px; overflow: hidden; position: relative;
      }

      /* Every screen swap replaces #screen's children wholesale, so a plain
         CSS entrance on freshly-inserted nodes replays on each transition with
         no JS hook. Kept small — 4px, not a bounce. */
      #screen > * { animation: rise 0.26s cubic-bezier(.2,.7,.3,1) both; }
      #screen > *:nth-child(1) { animation-delay: 0s; }
      #screen > *:nth-child(2) { animation-delay: .02s; }
      #screen > *:nth-child(3) { animation-delay: .04s; }
      #screen > *:nth-child(n+4) { animation-delay: .06s; }
      @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #screen > * { animation: none; } }

      /* ---------- screen skeleton: every screen is nav / body / actions ----- */
      .nav {
        flex: 0 0 auto; display: flex; align-items: center; gap: var(--s2);
        height: 40px; margin-bottom: var(--s1);
      }
      .nav-back {
        width: 30px; height: 30px; margin-left: -6px;
        display: grid; place-items: center;
        background: none; border: 0; border-radius: var(--r-sm);
        color: var(--fog); font-size: 17px; line-height: 1; cursor: pointer;
        transition: color 0.15s, background 0.15s;
      }
      .nav-back:hover { color: var(--paper); background: var(--surface); }
      .nav-label {
        font: 500 10px var(--font-mono); letter-spacing: 0.16em;
        text-transform: uppercase; color: var(--fog-dim);
      }
      .body {
        flex: 1; min-height: 0; display: flex; flex-direction: column;
        overflow-y: auto; scrollbar-width: thin;
      }
      .scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; }
      .actions { flex: 0 0 auto; display: flex; flex-direction: column; gap: var(--s2); padding-top: var(--s3); }
      .actions .row { display: flex; gap: var(--s2); }
      .actions .row > * { flex: 1; }
      .spacer { flex: 1; min-height: var(--s3); }
      .stack { display: flex; flex-direction: column; gap: var(--s2); }

      /* ---------- buttons: one base, four intents, two sizes --------------- */
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 7px;
        height: 44px; padding: 0 18px; width: 100%;
        font: 600 14px var(--font-ui); letter-spacing: 0.01em;
        border: 1px solid transparent; border-radius: var(--r-md);
        cursor: pointer; white-space: nowrap;
        transition: background 0.15s, border-color 0.15s, color 0.15s, opacity 0.15s;
      }
      .btn:active:not(:disabled) { transform: translateY(0.5px); }
      .btn:disabled { cursor: not-allowed; opacity: 0.38; }

      .btn--primary { background: var(--cyan); color: #04120f; }
      .btn--primary:hover:not(:disabled) { background: #4ae9d5; }

      .btn--secondary { background: var(--surface); color: var(--paper); border-color: var(--line-strong); }
      .btn--secondary:hover:not(:disabled) { background: var(--surface-hi); }

      .btn--quiet { background: none; color: var(--fog); font-weight: 500; height: 38px; }
      .btn--quiet:hover:not(:disabled) { color: var(--paper); background: var(--surface); }

      .btn--danger { background: var(--rose-soft); color: var(--rose); border-color: var(--rose-line); }
      .btn--danger:hover:not(:disabled) { background: rgba(242, 99, 90, 0.2); }

      .btn--sm { height: 34px; padding: 0 12px; font-size: 12.5px; border-radius: var(--r-sm); }
      .btn--auto { width: auto; }

      /* ---------- pills ---------- */
      .pill {
        display: inline-flex; align-items: center; gap: 6px;
        font: 500 10px var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase;
        padding: 4px 10px; border-radius: var(--r-full);
        border: 1px solid var(--line-strong); color: var(--fog); background: transparent;
      }
      .pill--cyan { color: var(--cyan); border-color: var(--cyan-line); background: var(--cyan-soft); }
      .pill--amber { color: var(--amber); border-color: var(--amber-line); background: var(--amber-soft); }
      .pill--rec { color: var(--rose); border-color: var(--rose-line); background: var(--rose-soft); }
      .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
      .pill--rec .dot { animation: blink 1.6s ease-in-out infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      @media (prefers-reduced-motion: reduce) { .pill--rec .dot { animation: none; } }

      /* ---------- cards ---------- */
      .card {
        display: block; width: 100%; text-align: left; cursor: pointer;
        background: var(--surface); color: var(--paper);
        border: 1px solid var(--line); border-radius: var(--r-lg);
        padding: 11px 13px; margin-bottom: 6px;
        transition: background 0.15s, border-color 0.15s;
        font-family: var(--font-ui);
      }
      .card:hover { background: var(--surface-hi); border-color: var(--line-strong); }
      .card.sel { border-color: var(--cyan-line); background: var(--cyan-soft); }
      .card .nm { font: 600 14px var(--font-ui); }
      .card .meta { font: 400 11.5px var(--font-mono); color: var(--fog-dim); margin-top: 3px; }
      .card .dist { float: right; font: 500 12px var(--font-mono); color: var(--fog); }
      .card.sel .dist { color: var(--cyan); }
      .card--static { cursor: default; }
      .card--static:hover { background: var(--surface); border-color: var(--line); }

      /* numbered step rows — the route list, where the number is the anchor */
      .step {
        display: flex; gap: 11px; align-items: baseline;
        padding: 10px 2px; border-bottom: 1px solid var(--line);
      }
      .step:last-child { border-bottom: 0; }
      .step .n {
        flex: none; width: 20px;
        font: 600 13px var(--font-mono); color: var(--cyan);
      }
      .step .txt { flex: 1; font: 400 13.5px/1.45 var(--font-ui); }
      .step .d { flex: none; font: 500 12px var(--font-mono); color: var(--fog-dim); }

      /* ---------- stats: hairline-divided row, straight off the site -------- */
      .stats {
        display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 1px;
        background: var(--line); border: 1px solid var(--line);
        border-radius: var(--r-lg); overflow: hidden; margin: var(--s3) 0;
      }
      .stat { background: var(--panel); padding: 10px 6px; text-align: center; }
      .stat b {
        display: block; font: 700 19px/1 var(--font-display);
        color: var(--paper); letter-spacing: 0.01em;
      }
      .stat span {
        display: block; margin-top: 4px;
        font: 500 9px var(--font-mono); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--fog-dim);
      }

      /* ---------- key/value summary ---------- */
      .summary {
        border: 1px solid var(--line); border-radius: var(--r-lg);
        background: var(--surface); padding: 4px 13px;
      }
      .summary .kv {
        display: flex; justify-content: space-between; gap: var(--s3);
        padding: 7px 0; border-bottom: 1px solid var(--line);
      }
      .summary .kv:last-child { border-bottom: 0; }
      .summary .kv span { font: 400 12.5px var(--font-ui); color: var(--fog); }
      .summary .kv b { font: 500 12.5px var(--font-mono); color: var(--paper); font-weight: 500; }
      .summary .kv b.ok { color: var(--cyan); }
      .summary .kv b.warn { color: var(--amber); }

      /* ---------- the quiet "why" note ---------- */
      .note {
        font: 400 12px/1.5 var(--font-ui); color: var(--fog-dim);
        border-left: 1px solid var(--line-strong); padding-left: 11px;
        margin: var(--s3) 0;
      }
      .note--warn { border-left-color: var(--amber-line); }

      /* ---------- inputs ---------- */
      .input {
        width: 100%; font: 400 14px var(--font-ui);
        padding: 11px 12px; border-radius: var(--r-md);
        background: var(--surface); color: var(--paper);
        border: 1px solid var(--line-strong);
      }
      .input::placeholder { color: var(--fog-dim); }
      .input:focus { outline: none; border-color: var(--cyan-line); box-shadow: 0 0 0 3px var(--cyan-soft); }

      /* ---------- map canvas + floating controls ---------- */
      canvas.map {
        width: 100%; display: block;
        border-radius: var(--r-lg); border: 1px solid var(--line);
        background: #050a10;
      }
      .map-wrap { position: relative; }
      .map-overlay {
        position: absolute; left: 10px; right: 10px; bottom: 10px;
        display: flex; flex-direction: column; gap: 7px;
      }
      .chip {
        flex: 1; height: 32px; padding: 0 10px;
        display: inline-flex; align-items: center; justify-content: center;
        font: 500 12px var(--font-ui); color: var(--paper);
        background: rgba(14, 23, 32, 0.82); backdrop-filter: blur(8px);
        border: 1px solid var(--line-strong); border-radius: var(--r-sm);
        cursor: pointer; transition: background 0.15s, border-color 0.15s;
      }
      .chip:hover { background: rgba(26, 39, 52, 0.92); border-color: var(--cyan-line); }
      .chip--wide { width: 100%; color: var(--amber); border-color: var(--amber-line); }

      /* ---------- GPS signal readout ---------- */
      .sig {
        display: flex; flex-direction: column; align-items: center;
        gap: var(--s2); padding: var(--s5) 0 var(--s4);
      }
      .sig-ring {
        width: 92px; height: 92px; border-radius: 50%;
        display: grid; place-items: center;
        border: 1px solid var(--line-strong);
        transition: border-color 0.4s, box-shadow 0.4s;
      }
      .sig-core {
        width: 12px; height: 12px; border-radius: 50%;
        background: var(--fog-dim); transition: background 0.4s;
      }
      .sig-ring.poor { border-color: var(--rose-line); }
      .sig-ring.poor .sig-core { background: var(--rose); }
      .sig-ring.fair { border-color: var(--amber-line); }
      .sig-ring.fair .sig-core { background: var(--amber); }
      .sig-ring.good { border-color: var(--cyan-line); box-shadow: 0 0 0 6px var(--cyan-soft); }
      .sig-ring.good .sig-core { background: var(--cyan); animation: ping 1.8s ease-in-out infinite; }
      @keyframes ping { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }
      @media (prefers-reduced-motion: reduce) { .sig-ring.good .sig-core { animation: none; } }
      .sig-acc { font: 700 30px/1 var(--font-display); color: var(--paper); letter-spacing: 0.01em; }
      .sig-label { font: 500 10px var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--fog-dim); }
      .sig-label.poor { color: var(--rose); }
      .sig-label.fair { color: var(--amber); }
      .sig-label.good { color: var(--cyan); }

      /* ---------- floor stepper ---------- */
      .floor-row {
        display: flex; align-items: center; justify-content: space-between;
        gap: var(--s3); margin-top: var(--s2); padding: 9px 9px 9px 13px;
        border: 1px solid var(--line); border-radius: var(--r-lg);
        background: var(--surface);
      }
      .floor-row > span { font: 400 13px var(--font-ui); color: var(--fog); }
      .stepper { display: flex; align-items: center; gap: var(--s1); }
      .stepper button {
        width: 30px; height: 30px; border-radius: var(--r-sm);
        display: grid; place-items: center;
        font: 500 16px/1 var(--font-ui); color: var(--paper);
        background: var(--surface-hi); border: 1px solid var(--line); cursor: pointer;
        transition: background 0.15s, color 0.15s;
      }
      .stepper button:hover { background: var(--cyan-soft); color: var(--cyan); border-color: var(--cyan-line); }
      .stepper b { min-width: 30px; text-align: center; font: 600 16px var(--font-display); }

      /* ---------- compass ---------- */
      .compass-wrap { display: flex; flex-direction: column; align-items: center; gap: var(--s2); margin: var(--s3) 0; }
      canvas.compass { touch-action: none; cursor: grab; }
      canvas.compass:active { cursor: grabbing; }
      .heading-read { font: 700 32px/1 var(--font-display); color: var(--paper); letter-spacing: 0.01em; }
      .heading-hint { font: 400 12.5px var(--font-ui); color: var(--fog); text-align: center; min-height: 34px; padding: 0 var(--s4); }
      .heading-hint.ok { color: var(--cyan); }

      /* ---------- crossing chips, level headers ---------- */
      .crossing {
        display: flex; justify-content: space-between; align-items: center;
        font: 400 12px var(--font-ui); color: var(--paper);
        padding: 7px 11px; margin-top: 5px;
        border: 1px solid var(--line); border-left: 2px solid var(--amber-line);
        border-radius: var(--r-sm); background: var(--surface);
      }
      .crossing span { font: 400 11.5px var(--font-mono); color: var(--fog-dim); }
      .levelhead {
        font: 500 10px var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--fog-dim); margin: var(--s3) 0 var(--s2);
        padding-bottom: 5px; border-bottom: 1px solid var(--line);
      }
      .levelhead:first-child { margin-top: 0; }

      /* ---------- bottom sheet ---------- */
      .sheet {
        border: 1px solid var(--line-strong); border-top: 2px solid var(--amber);
        border-radius: var(--r-xl) var(--r-xl) var(--r-lg) var(--r-lg);
        padding: var(--s5) var(--s4) var(--s4);
        background: var(--surface);
        box-shadow: 0 -16px 40px rgba(0, 0, 0, 0.45);
      }
      .cost {
        margin-top: var(--s3); padding: 2px 12px;
        border: 1px solid var(--line); border-radius: var(--r-md);
        background: var(--panel);
      }
      .cost .kv {
        display: flex; justify-content: space-between; gap: var(--s3);
        padding: 7px 0; border-bottom: 1px solid var(--line);
      }
      .cost .kv:last-child { border-bottom: 0; }
      .cost .kv span { font: 400 12.5px var(--font-ui); color: var(--fog); }
      .cost .kv b { font: 500 12.5px var(--font-mono); color: var(--paper); }
      .cost .kv b.warn { color: var(--amber); }
      .cost .kv b.bad { color: var(--rose); }

      /* ---------- hero (start screen) ---------- */
      .hero { text-align: center; padding: var(--s5) 0; }
      .hero-mark {
        font: 700 46px/1 var(--font-display); letter-spacing: 0.1em;
        color: var(--paper); margin-bottom: var(--s3);
      }
      .hero-line { font: 400 14px/1.55 var(--font-ui); color: var(--fog); max-width: 250px; margin: 0 auto; }

      /* ---------- toast ---------- */
      .toast {
        position: absolute; left: 50%; bottom: 24px; transform: translate(-50%, 6px);
        display: inline-flex; align-items: center; gap: 7px;
        background: var(--surface-hi); color: var(--paper);
        border: 1px solid var(--line-strong); border-radius: var(--r-full);
        padding: 8px 15px; font: 500 12.5px var(--font-ui);
        opacity: 0; pointer-events: none; z-index: 30; white-space: nowrap;
        transition: opacity 0.18s ease, transform 0.18s ease;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      /* =====================================================================
         debug rail — a technical instrument panel, not app UI. It shares the
         tokens so the page reads as one thing, but stays flat, mono and
         dense so it never gets mistaken for a screen.
         ===================================================================== */
      .rail {
        flex: 1; min-width: 300px; max-width: 440px; overflow-y: auto;
        background: var(--panel); border: 1px solid var(--line);
        border-radius: var(--r-lg); padding: var(--s4) var(--s4) var(--s5);
        font-family: var(--font-mono);
      }
      .rail h3 {
        font: 500 10px var(--font-mono); letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--fog-dim); margin: var(--s5) 0 var(--s2);
        padding-bottom: 6px; border-bottom: 1px solid var(--line);
      }
      .rail h3:first-child { margin-top: 0; }
      .rail label { display: block; font: 400 11px var(--font-mono); color: var(--fog-dim); margin: 11px 0 5px; }
      .rail input[type=range] { width: 100%; accent-color: var(--cyan); }
      .rail input[type=number], .rail input[type=text], .rail select {
        width: 100%; font: 400 12px var(--font-mono); padding: 7px 9px;
        border-radius: var(--r-sm); background: var(--surface);
        color: var(--paper); border: 1px solid var(--line-strong);
      }
      .rail button {
        display: block; width: 100%; text-align: left; margin-top: 5px;
        font: 400 11.5px var(--font-mono); color: var(--fog);
        padding: 8px 10px; border-radius: var(--r-sm);
        background: var(--surface); border: 1px solid var(--line); cursor: pointer;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
      }
      .rail button:hover { background: var(--surface-hi); color: var(--paper); }
      .rail button.on { background: var(--cyan-soft); border-color: var(--cyan-line); color: var(--cyan); }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 5px; }
      .grid2 button { margin-top: 0; }
      .rail .kv { display: flex; justify-content: space-between; gap: var(--s3); font-size: 11px; padding: 3px 0; }
      .rail .kv span { color: var(--fog-dim); }
      .rail .kv b { color: var(--fog); font-weight: 500; }
      .rail .sub { font-size: 10.5px; color: var(--fog-dim); line-height: 1.5; margin-top: 6px; }
      .log {
        margin-top: var(--s2); max-height: 140px; overflow-y: auto;
        font-size: 10.5px; color: var(--fog-dim);
        border-top: 1px solid var(--line); padding-top: 7px;
      }
      .log div { padding: 1px 0; }
      .dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 5px; }
      .dpad button { margin: 0; text-align: center; }
      .dpad .blank { visibility: hidden; }

      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: var(--r-full); }
      ::-webkit-scrollbar-track { background: transparent; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">INSID<span>UI prototype</span></div>
      <div class="seg">
        <button data-mode="collector" class="on">Collector</button>
        <button data-mode="user">Wayfinder</button>
      </div>
      <div class="src" id="src">loading…</div>
    </header>
    <main>
      <div class="stage">
        <div class="phone">
          <div class="screen-shell">
            <div class="island"></div>
            <div class="statusbar">
              <div id="sb-left">9:41</div>
              <div id="sb-right">LTE · 100%</div>
            </div>
            <div id="screen"></div>
            <div id="toast" class="toast"></div>
          </div>
        </div>
        <div class="stage-label" id="stage-label">Collector · Start</div>
      </div>
      <div class="rail" id="rail"></div>
    </main>
    <script type="module" src="./prototype.js"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="200" height="200" rx="40" fill="#0D1117" />

  <!-- Multi-Level Floor Rings (Mint Green) -->
  <!-- Base Floor Layer -->
  <path d="M 50 115 A 55 55 0 0 1 145 75" 
        fill="none" stroke="#52E0C4" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.4" />
  
  <!-- Middle Floor Layer -->
  <path d="M 42 100 A 60 60 0 0 1 158 100" 
        fill="none" stroke="#52E0C4" stroke-width="7" stroke-linecap="round" opacity="0.75" />
  
  <!-- Upper Floor Layer -->
  <path d="M 55 85 A 55 55 0 0 1 150 125" 
        fill="none" stroke="#52E0C4" stroke-width="8" stroke-linecap="round" />

  <!-- Dynamic Elevation Arrow (Warm Amber) -->
  <g transform="translate(100, 100) rotate(-35) translate(-100, -100)">
    <!-- Arrow Stem -->
    <path d="M 70 130 C 70 80, 120 120, 120 70" 
          fill="none" stroke="#F5A623" stroke-width="9" stroke-linecap="round" />
    <!-- Arrow Head -->
    <path d="M 105 65 L 122 65 L 122 82" 
          fill="none" stroke="#F5A623" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
